<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>oneweek</title>
    <link rel="icon" href="./oneweek-favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="./css/colors.css" />
    <link rel="stylesheet" href="./css/styles.css?v=20260720-15" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
    <script src="./js/theme-init.js"></script>
  </head>
  <body>
    <script>
      window.supabaseClient = supabase.createClient(
        "https://ywofdvbtcbvkkjxcazlu.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3b2ZkdmJ0Y2J2a2tqeGNhemx1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4NjQwMjgsImV4cCI6MjA5MDQ0MDAyOH0.n5eglSosCp6M3mH8i559VczJxVFy73t4U6npUPIVxoY"
      );
    </script>

    <main class="layout">
      <header class="panel-titlebar layout-header">
        <button
          class="icon-button layout-header-menu"
          type="button"
          id="auth-trigger-mobile"
          aria-label="User"
        >
          <span class="icon-themed" aria-hidden="true"></span>
        </button>
        <div class="layout-header-week">
          <nav class="week-nav" aria-label="Week navigation">
            <button class="icon-button week-nav-btn" type="button" id="week-prev" aria-label="Previous week">
              <span class="icon-themed icon-themed-arrow" aria-hidden="true"></span>
            </button>
            <span class="week-nav-label" id="week-nav-label">this week</span>
            <button class="icon-button week-nav-btn week-nav-btn--next" type="button" id="week-next" aria-label="Next week">
              <span class="icon-themed icon-themed-arrow" aria-hidden="true"></span>
            </button>
          </nav>
        </div>
        <div class="layout-header-right">
          <button type="button" class="header-text-btn" id="week-go-this-week" hidden>
            Now
          </button>
          <div
            class="workspace-tabs"
            id="workspace-tabs"
            role="tablist"
            aria-label="Workspaces"
            hidden
          >
            <button
              type="button"
              class="workspace-tabs-add"
              id="workspace-tabs-add"
              aria-label="Add workspace"
              title="Add workspace"
            >
              <span class="icon-themed icon-themed-plus" aria-hidden="true"></span>
            </button>
            <div class="workspace-tabs-list" id="workspace-tabs-list"></div>
          </div>
        </div>
      </header>
      <section class="panel week-panel" aria-label="Week">
        <div class="week-grid">
          <div class="rectangle day-rect" data-day="Monday">
            <div class="day-label">monday</div>
            <div class="day-tasks" id="day-Monday" aria-label="Monday tasks"></div>
          </div>
          <div class="rectangle day-rect" data-day="Tuesday">
            <div class="day-label">tuesday</div>
            <div
              class="day-tasks"
              id="day-Tuesday"
              aria-label="Tuesday tasks"
            ></div>
          </div>
          <div class="rectangle day-rect" data-day="Wednesday">
            <div class="day-label">wednesday</div>
            <div
              class="day-tasks"
              id="day-Wednesday"
              aria-label="Wednesday tasks"
            ></div>
          </div>
          <div class="rectangle day-rect" data-day="Thursday">
            <div class="day-label">thursday</div>
            <div
              class="day-tasks"
              id="day-Thursday"
              aria-label="Thursday tasks"
            ></div>
          </div>
          <div class="rectangle day-rect" data-day="Friday">
            <div class="day-label">friday</div>
            <div class="day-tasks" id="day-Friday" aria-label="Friday tasks"></div>
          </div>
          <div class="rectangle day-rect" data-day="Saturday">
            <div class="day-label">saturday</div>
            <div
              class="day-tasks"
              id="day-Saturday"
              aria-label="Saturday tasks"
            ></div>
          </div>
          <div class="rectangle day-rect" data-day="Sunday">
            <div class="day-label">sunday</div>
            <div class="day-tasks" id="day-Sunday" aria-label="Sunday tasks"></div>
          </div>
          <div class="rectangle day-rect" data-day="Next week">
            <div class="day-label">next week</div>
            <div
              class="day-tasks"
              id="day-Next-week"
              aria-label="Next week tasks"
            ></div>
          </div>
        </div>
      </section>

      <section class="panel tasks-panel" aria-label="Tasks">
        <div class="rectangle tasks-field" id="tasks-field" aria-label="Tasks area">
          <div class="tasks-field-header">
            <div class="day-label tasks-field-label">tasks</div>
            <button
              type="button"
              class="tasks-field-action"
              id="tasks-move-remaining"
              hidden
            >
              move remaining tasks
            </button>
          </div>
          <div id="tasks-field-root" class="tasks-field-root"></div>
        </div>
      </section>
    </main>

    <div
      id="connection-banner"
      class="connection-banner"
      role="status"
      aria-live="polite"
      hidden
    >
      <span class="connection-banner-text">пока нет связи, но задачи всё равно сохраняются</span>
    </div>

    <div
      class="guest-auth-backdrop"
      id="guest-auth-backdrop"
      role="dialog"
      aria-modal="true"
      aria-labelledby="guest-auth-title"
      hidden
    >
      <div class="guest-auth-modal">
        <h2 id="guest-auth-title" class="guest-auth-title">
          Sign in or sign up
        </h2>
        <p class="guest-auth-text">
          Required to safely store your tasks and sync them across your
          devices.
        </p>
        <form
          class="guest-auth-form"
          id="guest-auth-form"
          name="guest-auth"
          method="post"
          action="#"
          autocomplete="on"
        >
          <input
            id="guest-auth-email"
            class="guest-auth-input"
            type="email"
            name="email"
            placeholder="Email"
            autocomplete="username"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            inputmode="email"
            required
          />
          <input
            id="guest-auth-password"
            class="guest-auth-input"
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="current-password"
            autocapitalize="off"
            autocorrect="off"
            spellcheck="false"
            minlength="6"
            required
          />
          <button type="submit" class="guest-auth-submit" id="guest-auth-submit">
            Sign in / Sign up
          </button>
        </form>
        <div id="guest-auth-message-slot" class="guest-auth-message-slot">
          <p
            id="guest-auth-message"
            class="guest-auth-message"
            aria-live="polite"
          ></p>
        </div>
      </div>
    </div>

    <div class="sidebar-overlay" id="auth-overlay" hidden></div>
    <nav class="sidebar" id="sidebar" aria-label="Menu" hidden>
      <div class="sidebar-content">
        <div class="sidebar-header">
          <h2 class="sidebar-title">Settings</h2>
          <button type="button" class="sidebar-close" id="auth-close" aria-label="Close">
            <span class="icon-themed icon-themed-close" aria-hidden="true"></span>
          </button>
        </div>
        <div class="sidebar-scroll">
        <p id="auth-message" class="auth-message" aria-live="polite"></p>

        <div
          class="sidebar-section sidebar-section-workspaces"
          id="sidebar-section-workspaces"
          hidden
        >
          <p class="sidebar-section-title">Workspace</p>
          <div class="sidebar-select-wrap">
            <select id="sidebar-workspace-select" class="sidebar-select"></select>
          </div>
          <div
            class="sidebar-actions"
            id="sidebar-workspace-delete-actions"
            hidden
          >
            <button type="button" id="sidebar-workspace-delete">Delete</button>
          </div>
        </div>

        <div class="sidebar-section">
          <p class="sidebar-section-title">Themes</p>
          <div class="sidebar-select-wrap">
            <select id="theme-select" class="sidebar-select"></select>
          </div>
          <div class="sidebar-actions" id="theme-delete-actions" hidden>
            <button type="button" id="theme-delete" hidden>Delete theme</button>
          </div>
          <div id="theme-custom-fields" class="theme-custom-fields" hidden>
            <label class="sidebar-label" for="theme-custom-name">Name</label>
            <input
              id="theme-custom-name"
              class="sidebar-input"
              type="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="My theme"
            />
            <label class="sidebar-label" for="theme-color-text">Text</label>
            <input
              id="theme-color-text"
              class="sidebar-input"
              type="text"
              inputmode="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="#000000"
            />
            <label class="sidebar-label" for="theme-color-background">Background</label>
            <input
              id="theme-color-background"
              class="sidebar-input"
              type="text"
              inputmode="text"
              spellcheck="false"
              autocomplete="off"
              placeholder="#ffffff"
            />
            <label class="sidebar-label" for="theme-font">Font</label>
            <div class="sidebar-select-wrap">
              <select id="theme-font" class="sidebar-select"></select>
            </div>
            <div class="sidebar-actions">
              <button type="button" id="theme-apply">Save</button>
            </div>
          </div>
        </div>

        <div class="sidebar-section sidebar-section-weeks">
          <p class="sidebar-section-title">Weeks</p>
          <div class="weeks-list-scroll">
            <div class="weeks-list-viewport">
              <ul id="weeks-list" class="weeks-list"></ul>
            </div>
          </div>
        </div>
        </div>

        <div class="sidebar-account sidebar-section">
          <p id="auth-status" class="auth-status" aria-live="polite"></p>
          <div id="auth-account-guest" class="auth-account-panel">
            <input id="email" class="sidebar-input" placeholder="Email" />
            <input id="password" class="sidebar-input" type="password" placeholder="Password" />
            <div class="sidebar-actions">
              <button type="button" id="auth-signup">Sign up</button>
              <button type="button" id="auth-login">Login</button>
            </div>
          </div>
          <div id="auth-account-signed-in" class="auth-account-panel" hidden>
            <div class="sidebar-actions">
              <button type="button" id="logout-button">Logout</button>
            </div>
          </div>
          <p class="sidebar-about">
            <a href="./about.html" class="sidebar-about-link">About oneweek</a>
          </p>
        </div>
      </div>
    </nav>

    <script src="./js/workspaces.js"></script>
    <script src="./js/script.js?v=20260720-17"></script>
    <script src="./js/workspace-tabs.js"></script>
  </body>
</html>
